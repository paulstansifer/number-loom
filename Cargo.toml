[[bin]]
name = "number-loom"
path = "src/bin/number-loom.rs"

# A benchmarking tool, hidden behind a non-default feature so `cargo install` doesn't
# install it on user computers.
[[bin]]
name = "bench-pbnsolve"
path = "src/bin/bench-pbnsolve.rs"
required-features = ["bench-pbnsolve"]

# This is used to evaluate different "human-like" solve techniques, also hidden.
[[bin]]
name = "eval-techniques"
path = "src/bin/eval-techniques.rs"
required-features = ["eval-techniques"]

[package]
name = "number-loom"
description = "Multipurpose GUI and CLI tool for constructing nonograms"
version = "0.7.0"
authors = ["Paul Stansifer <paul.stansifer@gmail.com>"]
edition = "2024"
license = "MIT"
keywords = ["nonogram"]
readme = "README.md"
repository = "https://github.com/paulstansifer/number-loom"
default-run = "number-loom"
exclude = ["examples/", "media/icon.xcf"]

# (See the [[bin]] section)
[features]
bench-pbnsolve = []
eval-techniques = []

[dependencies]
image = "0.25"
quick-xml = "0.42.0"
indoc = "2"
anyhow = "1.0.93"
clap = { version = "4.5.21", features = ["derive"] }
colorize = "0.1.0"
colored = "3"
regex = "1.11.1"
roxmltree = "0.21.1"
indicatif = "0.18.6"
egui = { version = "0.37", features = [
    "persistence",
    "monochrome_emoji_fonts",
] }
eframe = "0.37"
ab_glyph = "0.2" # for font outlining
epaint_default_fonts = "0.37" # for font outlining
rfd = "0.17.2"
itertools = "0.15.0"
egui_material_icons = "0.3.0"
console_error_panic_hook = "0.1.7"
tokio = { version = "1", features = ["rt"] } # Only wasm-safe features
mnemonic = "1.1.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
zip = "9.0.5"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
base64 = "0.23.1"
brotli = "9.0.0"
web-time = "1.1.0"
typed-index-collections = { version = "3.5.0", features = ["serde", "std"] }
rand = "0.10.3"

[dev-dependencies]
egui_kittest = "0.37"

[[test]]
name = "solver-fuzzer"
path = "src/solver_fuzzer.rs"


# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
criterion = "0.8.2"
preferences = "2.0.0"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }

# Needed to spawn async tasks
wasm-bindgen-futures = "0.4.50"

# These three are needed to just make yield work!
web-sys = { version = "0.3.77", features = [
    "History",
] } # `History`: for `clear_url_hash`
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"

gloo-storage = "0.4.0"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[[bench]]
name = "benchmark"
harness = false
