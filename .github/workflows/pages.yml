name: Publish to GitHub Pages

# Publishes the web build of the app at https://paulstansifer.github.io/number-loom/, along with
# the puzzle library, `puzzles.zip`. Both go in one workflow because each Pages deployment
# replaces the whole site.
#
# The in-app puzzle library fetches https://paulstansifer.github.io/number-loom/puzzles.zip.
# It has to be Pages rather than a release asset: a release download redirects to another host,
# and neither hop sends the `Access-Control-Allow-Origin` header that the wasm build needs to
# read it from itch.io. Pages sends `Access-Control-Allow-Origin: *`.

on:
  push:
    branches:
      - main
  workflow_dispatch:  # to republish without pushing anything

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race, but don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: 'v0.21.14'
      - name: Build the app
        run: trunk build --release --dist _site
      - name: Create zip archive
        # Zipped from inside `puzzles/`, so entries are bare filenames with no directory prefix.
        run: (cd puzzles && zip -r ../_site/puzzles.zip .)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
