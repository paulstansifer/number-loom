<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <title>Number Loom</title>

    <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->
    <link data-trunk rel="rust" data-wasm-opt="2" data-bin="number-loom" />

    <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
    <base data-trunk-public-url />

    <!-- What makes this an installable PWA; see `web/`. -->
    <link data-trunk rel="copy-file" href="web/manifest.json" />
    <link data-trunk rel="copy-file" href="web/sw.js" />
    <link data-trunk rel="copy-file" href="web/icon-192.png" />
    <link data-trunk rel="copy-file" href="web/icon-512.png" />
    <link rel="manifest" href="manifest.json" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            background: #909090;
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- The WASM code will resize the canvas dynamically -->
    <!-- the id is hardcoded in main.rs -->
    <canvas id="the_canvas_id"></canvas>

    <!-- loading spinner -->
    <div class="centered" id="loading_text">
        <p style="font-size:16px">
            Loading…
        </p>
        <div class="lds-dual-ring"></div>
    </div>

    <!-- On a touchscreen, eframe hears about every tap twice, as a touch event and as a pointer
         event, and each one presses egui's primary button: a tap would paint a cell and then
         immediately unpaint it, and a checkbox would toggle twice. So keep the pointer version of
         a touch away from eframe. Its listeners are on the canvas and the document, so stopping
         the event while it's being captured at `window` is early enough. Mouse and pen input
         only arrive as pointer events, so they're left alone.

         What this gives up: eframe's pointer handlers run a frame on the spot, because Safari
         only allows things like clipboard writes and downloads during a user's event. If those
         stop working from a tap on iOS, this is why. -->
    <script>
        for (const type of ['pointerdown', 'pointerup']) {
            window.addEventListener(type, (event) => {
                if (event.pointerType !== 'touch') {
                    return;
                }
                event.stopPropagation();
                // eframe's `pointerup` handler also focuses the canvas, which it says iOS needs
                // for the on-screen keyboard to work. Its touch handlers don't, so do that here.
                if (type === 'pointerup' && event.target instanceof HTMLCanvasElement) {
                    event.target.focus();
                }
            }, { capture: true });
        }
    </script>

    <!--Register Service Worker. this will cache the wasm / js scripts for offline use (for PWA functionality). -->
    <!-- Force refresh (Ctrl + F5) to load the latest files instead of cached files  -->
    <script>
        // We disable caching during development so that we always view the latest version.
        if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>

</html>
